<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Add Project</title>
  <style>
    :root{--bg:#0f1720;--panel:#0b1220;--muted:#9aa0a6;--accent:#e05555;--accent-2:#6fb3ff;--card:#0f1620}
    *{box-sizing:border-box}
    body{background:linear-gradient(180deg,#071025 0%,var(--bg) 100%);color:#e6eef6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;padding:28px}
  .wrap{max-width:1200px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:20px;border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  header h1{margin:0;font-size:20px}
  /* widened right column for Published Projects */
  .admin-grid{display:grid;grid-template-columns:1fr 460px;gap:18px}
    @media (max-width:980px){ .admin-grid{grid-template-columns:1fr} }

    .panel{background:var(--panel);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    label{display:block;margin-top:10px;font-weight:600;color:#dfe9f5}
    input,textarea,select{width:100%;padding:10px;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);border-radius:8px;color:inherit}
    textarea{min-height:140px}
    .row{display:flex;gap:10px}
    .half{flex:1}

    .actions{display:flex;gap:10px;align-items:center;margin-top:12px}
    button.btn{padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
    button.primary{background:var(--accent);color:#fff}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#cfe6ff}
    .hint{color:var(--muted);font-size:13px;margin-top:6px}

    /* Preview & sidebar */
    .sidebar{display:flex;flex-direction:column;gap:12px}
    .preview{padding:12px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
  .projects-list{max-height:600px;overflow:auto;padding:6px;scrollbar-gutter:stable;padding-right:12px}
  .project-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;margin-bottom:8px;background:var(--card);border:1px solid rgba(255,255,255,0.02);min-height:56px}
  .project-thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#0a0a0a;flex:0 0 56px}
  .project-meta{flex:1;min-width:0}
  .project-meta > strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .project-meta .label-muted{margin-top:4px;font-size:12px}
    .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .badge{background:rgba(255,255,255,0.03);color:#cfe6ff;padding:4px 8px;border-radius:999px;font-size:12px}
  .project-actions{display:flex;gap:8px;align-items:center}
    .project-actions button{padding:6px 8px;border-radius:6px;border:0;cursor:pointer}
    .project-actions .edit{background:var(--accent-2);color:#063047}
    .project-actions .del{background:#2b2b2b;color:#ffb3b3}

    .edit-banner{background:linear-gradient(90deg,rgba(255,85,85,0.08),rgba(111,179,255,0.04));padding:8px;border-radius:8px;color:#dceeff;font-weight:600;text-align:center;margin-bottom:12px}

    /* Toast */
    .toast{position:fixed;right:20px;bottom:20px;min-width:220px;background:#051026;color:#dff0ff;padding:12px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6);display:none}
    .toast.show{display:block;animation:toastIn .28s ease}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    .label-muted{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Admin — Projects</h1>
      <div class="label-muted">Add, edit or remove projects — changes create backups</div>
    </header>

    <div id="adminNotice" class="edit-banner" style="display:none"></div>
    <div id="editBanner" class="edit-banner" style="display:none">Editing project</div>

    <div class="admin-grid">
      <div class="panel admin-form">
        <label>Project Title</label>
        <input id="title" placeholder="Project title" />

        <div class="row">
          <div class="half">
            <label>Thumbnail URL</label>
            <input id="thumbnail" placeholder="https://..." />
          </div>
          <div class="half">
            <label>Categories (choose or add)</label>
            <div style="display:flex;gap:8px;align-items:center">
              <select id="categorySelect">
                <option value="">-- select --</option>
                <option>Defensive - Blue Teaming</option>
                <option>Offensive - Red Teaming</option>
                <option>Websites - Security</option>
                <option>Hands-On Security Case Studies &amp; Simulations</option>
              </select>
              <input id="customCategory" placeholder="or type custom" />
            </div>
            <small class="hint">You can add multiple categories by comma-separating them in the final field.</small>
          </div>
        </div>

        <label>Short Description</label>
        <input id="description" placeholder="Short summary" />

        <label>Detailed Description</label>
        <textarea id="long_description" placeholder="Long form (supports simple bullets)"></textarea>

        <div class="row">
          <div class="half">
            <label>Skills (comma-separated)</label>
            <input id="skills" placeholder="e.g., Python, AWS, Docker" />
          </div>
          <div class="half">
            <label>Project Link</label>
            <input id="link" placeholder="https://github.com/... or article link" />
          </div>
        </div>

        <div class="row">
          <div class="half">
            <label>Completion Date</label>
            <input id="date" type="date" />
          </div>
          <div class="half">
            <label>Images (comma-separated URLs)</label>
            <input id="images" placeholder="https://..., https://..." />
          </div>
        </div>

        <div class="actions">
          <button id="submit" class="btn primary">Save Project</button>
          <button id="cancelEdit" class="btn ghost" style="display:none">Cancel</button>
          <div id="result" class="label-muted" style="margin-left:8px"></div>
        </div>

        <div class="preview" id="preview"></div>
      </div>

      <aside class="sidebar panel">
        <h3 style="margin:0 0 8px">Published Projects</h3>
        <div id="projectList" class="projects-list"></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/admin-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
