<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <style>
    :root{--bg-1:#041026;--bg-2:#071025;--card:#071827;--muted:#9aa0a6;--accent:#e05555}
  html,body{height:100%;}
  body{font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));color:#e6eef6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;margin:0;padding:80px 20px 48px}

  /* top logo */
  /* leave space for macOS safe area/notch */
  .logo-wrap{width:140px;height:140px;display:flex;align-items:center;justify-content:center;margin-top:6px}
  /* show entire image, don't crop; make circular */
  .logo{width:100%;height:100%;object-fit:contain;border-radius:50%;box-shadow:0 12px 30px rgba(2,6,23,0.6);background:transparent;border:0;display:block;transition:transform .35s ease,box-shadow .35s ease}
    .logo:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(2,6,23,0.7)}

    /* card */
    .card{background:rgba(6,18,30,0.6);backdrop-filter:blur(6px);padding:28px;border-radius:14px;border:1px solid rgba(255,255,255,0.04);width:420px;max-width:96vw;box-shadow:0 12px 40px rgba(2,6,23,0.6);display:flex;flex-direction:column;align-items:stretch;margin-top:20px;opacity:0;transform:translateY(8px);animation:cardIn .45s ease forwards}
    @keyframes cardIn{to{opacity:1;transform:none}}

    h2{margin:6px 0 6px;font-size:20px;text-align:center}
    .muted{color:var(--muted);font-size:13px;margin-top:6px;text-align:center}

    form{width:100%;display:flex;flex-direction:column;margin-top:12px}
    label{display:block;margin-top:8px;font-weight:600;color:#dfe9f5}
    input{width:100%;padding:12px 14px;margin-top:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:inherit;outline:none;transition:box-shadow .18s ease,transform .12s ease}
    input:focus{box-shadow:0 6px 20px rgba(6,20,40,0.6);transform:translateY(-1px)}

    .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    button{padding:12px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--accent),#ff7b7b);color:#fff;font-weight:600;cursor:pointer;transition:filter .12s ease,transform .08s ease}
    button:hover{filter:brightness(.98);transform:translateY(-1px)}

    .error{color:#ffb3b3;margin-top:8px;text-align:center;min-height:18px}
    footer.tip{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}

    @media (max-width:480px){
      .logo-wrap{width:96px;height:96px}
      .card{width:100%;padding:20px}
      body{padding:48px 12px 24px}
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="assets/images/LOGO2.png" alt="Logo" class="logo" />
  </div>

  <div class="card">
    <h2>Admin login</h2>
    <p class="muted">Enter the password to access the admin dashboard.</p>
    <form id="adminLoginForm" method="post" action="/admin/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div class="actions">
        <button type="submit">Sign in</button>
      </div>
    </form>
    <div class="error" id="error" style="display:none"></div>
  </div>
  <script src="js/admin-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    const msg = params.get('msg');
    const el = document.getElementById('error');
    if (err === 'invalid') { el.textContent = 'Invalid password'; el.style.display = 'block'; }
    if (err === 'missing') { el.textContent = 'Please enter the password'; el.style.display = 'block'; }
    if (msg === 'loggedout') { el.textContent = 'You have been logged out'; el.style.color = '#9aa0a6'; el.style.display = 'block'; }
    const form = document.getElementById('adminLoginForm');
    const pwd = document.getElementById('password');
    const API_BASE = (window.ADMIN_API_BASE || '').replace(/\/$/, '');
    const loginUrl = API_BASE ? `${API_BASE}/admin/login` : '/admin/login';

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        el.style.display = 'none';
        const password = (pwd && pwd.value) ? pwd.value : '';
        if (!password) {
          el.textContent = 'Please enter the password';
          el.style.display = 'block';
          return;
        }
        try {
          const resp = await fetch(loginUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ password })
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || data.ok === false) {
            el.textContent = data.error || 'Invalid password';
            el.style.display = 'block';
            return;
          }
          if (data.token) {
            localStorage.setItem('admin_token', data.token);
          }
          window.location.href = 'admin.html';
        } catch (err) {
          el.textContent = 'Login failed. Check backend URL and try again.';
          el.style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
